<!DOCTYPE html>
<html lang="id">
<head> #kuis-python
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8fc">
    <title>RuangKuis — Belajar, bermain, berkembang</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20243a;
            --muted: #777d91;
            --purple: #6747e8;
            --purple-dark: #5235ce;
            --purple-soft: #f0edff;
            --line: #e9eaf1;
            --surface: #fff;
            --background: #f7f8fc;
            --green: #23956a;
            --green-soft: #e7f7ef;
            --red: #d84f61;
            --red-soft: #fff0f1;
            --shadow: 0 16px 48px rgba(37, 39, 68, .07);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            background: var(--background);
            color: var(--ink);
        }

        button { font: inherit; }
        button:focus-visible, a:focus-visible {
            outline: 3px solid rgba(103, 71, 232, .36);
            outline-offset: 3px;
        }

        .topbar {
            height: 76px;
            padding: 0 max(24px, calc((100% - 1120px) / 2));
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, .86);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            color: var(--ink);
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -.5px;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 36px;
            height: 36px;
            place-items: center;
            border-radius: 12px;
            background: var(--purple);
            color: white;
            font-size: 19px;
        }

        .top-note {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        main {
            width: min(100% - 40px, 1040px);
            margin: 0 auto;
            padding: 48px 0 72px;
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 42px 46px;
            border-radius: 24px;
            background: linear-gradient(115deg, #332270 0%, #6045cd 57%, #8068ed 100%);
            color: white;
            box-shadow: 0 18px 42px rgba(72, 53, 166, .2);
        }

        .hero::after {
            position: absolute;
            top: -115px;
            right: -25px;
            width: 320px;
            height: 320px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 50%;
            box-shadow: 0 0 0 30px rgba(255,255,255,.035), 0 0 0 65px rgba(255,255,255,.035);
            content: "";
            pointer-events: none;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #d8d0ff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1, h2, h3, p { margin-top: 0; }
        .hero h1 {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin-bottom: 12px;
            font-size: clamp(29px, 4vw, 42px);
            line-height: 1.12;
            letter-spacing: -1.5px;
        }

        .hero-copy {
            position: relative;
            z-index: 1;
            max-width: 510px;
            margin: 0;
            color: #e6e1ff;
            font-size: 15px;
            line-height: 1.65;
        }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin: 38px 0 17px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 21px;
            letter-spacing: -.5px;
        }

        .section-heading p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .quiz-card {
            display: flex;
            min-height: 205px;
            flex-direction: column;
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 5px 18px rgba(37, 39, 68, .025);
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .quiz-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .quiz-icon {
            display: grid;
            width: 49px;
            height: 49px;
            flex: 0 0 auto;
            place-items: center;
            border-radius: 15px;
            font-size: 24px;
        }

        .quiz-icon.violet { background: #f0edff; }
        .quiz-icon.mint { background: #e6f7f1; }

        .quiz-card h3 {
            margin: 1px 0 6px;
            font-size: 17px;
            letter-spacing: -.3px;
        }

        .quiz-card .description {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: auto;
            padding-top: 22px;
        }

        .quiz-meta {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .button {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 17px;
            border: 0;
            border-radius: 11px;
            background: var(--purple);
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 750;
            transition: background .15s ease, transform .15s ease;
        }

        .button:hover { background: var(--purple-dark); }
        .button:active { transform: scale(.98); }
        .button.secondary {
            border: 1px solid var(--line);
            background: white;
            color: var(--ink);
        }
        .button.secondary:hover { background: #f8f7ff; }
        .button.subtle {
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid var(--line);
            background: white;
            color: var(--muted);
        }
        .button.subtle:hover { color: var(--ink); }
        .button:disabled { cursor: not-allowed; opacity: .48; }

        .history-section { margin-top: 42px; }
        .history-list { display: grid; gap: 10px; }
        .history-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 15px 17px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: white;
        }

        .history-title {
            margin: 0 0 4px;
            font-size: 14px;
            font-weight: 750;
        }
        .history-date { margin: 0; color: var(--muted); font-size: 12px; }
        .history-score {
            display: flex;
            align-items: center;
            gap: 13px;
        }
        .score-pill {
            min-width: 66px;
            padding: 7px 10px;
            border-radius: 9px;
            background: var(--purple-soft);
            color: var(--purple-dark);
            text-align: center;
            font-size: 13px;
            font-weight: 800;
        }
        .empty-history {
            padding: 22px;
            border: 1px dashed #d9d9e5;
            border-radius: 14px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
        }
        .notice {
            margin: 18px 0 0;
            padding: 12px 15px;
            border-radius: 11px;
            background: #fff7e6;
            color: #805b16;
            font-size: 13px;
            line-height: 1.5;
        }

        .quiz-shell { max-width: 780px; margin: 0 auto; }
        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 24px;
        }
        .quiz-header-left { display: flex; align-items: center; gap: 13px; }
        .quiz-header h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.3px; }
        .quiz-header p { margin: 0; color: var(--muted); font-size: 12px; }
        .progress-wrap { margin-bottom: 20px; }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
        }
        .progress-track {
            height: 7px;
            overflow: hidden;
            border-radius: 99px;
            background: #e9e8f1;
        }
        .progress-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #6747e8, #a18aff);
            transition: width .25s ease;
        }
        .question-card {
            padding: clamp(21px, 4vw, 34px);
            border: 1px solid var(--line);
            border-radius: 20px;
            background: white;
            box-shadow: var(--shadow);
        }
        .question-number {
            margin-bottom: 12px;
            color: var(--purple);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .8px;
            text-transform: uppercase;
        }
        .question-text {
            margin: 0 0 24px;
            font-size: clamp(19px, 3vw, 24px);
            line-height: 1.4;
            letter-spacing: -.45px;
        }
        .answer-list { display: grid; gap: 11px; }
        .answer-option {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 13px;
            padding: 14px;
            border: 1.5px solid var(--line);
            border-radius: 13px;
            background: white;
            color: var(--ink);
            cursor: pointer;
            text-align: left;
            transition: border .15s ease, background .15s ease;
        }
        .answer-option:hover { border-color: #b7aaff; background: #fbfaff; }
        .answer-option.selected { border-color: var(--purple); background: #f5f2ff; }
        .answer-letter {
            display: grid;
            width: 30px;
            height: 30px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid #e6e5ec;
            border-radius: 9px;
            background: white;
            color: #777d91;
            font-size: 12px;
            font-weight: 800;
        }
        .answer-option.selected .answer-letter {
            border-color: var(--purple);
            background: var(--purple);
            color: white;
        }
        .answer-label { font-size: 14px; line-height: 1.45; }
        .question-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
        }
        .question-nav { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 20px; }
        .nav-dot {
            width: 35px;
            height: 35px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: white;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            font-weight: 750;
        }
        .nav-dot.current { border-color: var(--purple); background: var(--purple); color: white; }
        .nav-dot.answered:not(.current) { border-color: #c9bfff; background: var(--purple-soft); color: var(--purple-dark); }
        .answer-hint { margin: 15px 0 0; color: var(--muted); font-size: 12px; }

        .result-card {
            max-width: 760px;
            margin: 0 auto;
            padding: clamp(24px, 5vw, 42px);
            border: 1px solid var(--line);
            border-radius: 22px;
            background: white;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .result-icon {
            display: grid;
            width: 68px;
            height: 68px;
            margin: 0 auto 15px;
            place-items: center;
            border-radius: 22px;
            background: #fff5d9;
            font-size: 33px;
        }
        .result-card h1 { margin-bottom: 7px; font-size: 27px; letter-spacing: -.8px; }
        .result-subtitle { margin-bottom: 25px; color: var(--muted); font-size: 14px; }
        .score-number { color: var(--purple); font-size: 54px; font-weight: 850; letter-spacing: -2px; line-height: 1; }
        .score-caption { margin: 8px 0 24px; color: var(--muted); font-size: 13px; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .stat {
            padding: 14px 8px;
            border-radius: 13px;
            background: #f7f7fb;
        }
        .stat strong { display: block; margin-bottom: 4px; font-size: 18px; }
        .stat span { color: var(--muted); font-size: 11px; }
        .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

        .review-shell { max-width: 780px; margin: 0 auto; }
        .review-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
        }
        .review-heading h1 { margin: 0 0 5px; font-size: 24px; letter-spacing: -.7px; }
        .review-heading p { margin: 0; color: var(--muted); font-size: 13px; }
        .review-card {
            margin-bottom: 13px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: white;
        }
        .review-card.correct { border-left: 4px solid var(--green); }
        .review-card.incorrect { border-left: 4px solid var(--red); }
        .review-question { margin: 0 0 13px; font-size: 15px; font-weight: 750; line-height: 1.5; }
        .review-line {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .review-line strong { color: var(--ink); }
        .review-line .good { color: var(--green); }
        .review-line .bad { color: var(--red); }
        .review-explanation {
            margin: 13px 0 0;
            padding: 11px 13px;
            border-radius: 10px;
            background: #f7f7fb;
            color: #5f6478;
            font-size: 12px;
            line-height: 1.6;
        }
        .review-footer { margin-top: 20px; text-align: center; }

        @media (max-width: 640px) {
            .topbar { height: 64px; padding: 0 18px; }
            .top-note { font-size: 11px; }
            main { width: min(100% - 28px, 1040px); padding: 25px 0 50px; }
            .hero { padding: 30px 24px; border-radius: 19px; }
            .hero::after { right: -190px; }
            .quiz-grid { grid-template-columns: 1fr; gap: 12px; }
            .quiz-card { min-height: 180px; }
            .section-heading { align-items: flex-start; margin-top: 30px; }
            .quiz-header { align-items: flex-start; }
            .quiz-header .button { min-height: 38px; padding: 0 11px; font-size: 12px; }
            .question-card { border-radius: 16px; }
            .answer-option { padding: 12px; }
            .question-footer .button { padding: 0 12px; }
            .history-row { align-items: flex-start; }
            .history-score { flex-direction: column; align-items: flex-end; gap: 7px; }
            .history-score .button { min-height: 33px; }
            .review-heading { align-items: flex-start; }
            .review-heading h1 { font-size: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#" id="home-link" aria-label="RuangKuis, beranda">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span>ruangkuis</span>
        </a>
        <span class="top-note">Belajar jadi lebih seru ✨</span>
    </header>
    <main id="app" aria-live="polite"></main>

    <script>
        "use strict";

        const QUIZZES = [
            {
                id: "python-dasar",
                title: "Python Dasar",
                description: "Kenali sintaks, tipe data, dan konsep dasar Python.",
                icon: "🐍",
                theme: "violet",
                questions: [
                    {
                        text: "Fungsi apa yang digunakan untuk menampilkan teks ke layar di Python?",
                        options: ["show()", "print()", "display()", "echo()"],
                        answer: 1,
                        explanation: "print() adalah fungsi bawaan Python untuk menampilkan nilai ke terminal."
                    },
                    {
                        text: "Manakah contoh tipe data boolean di Python?",
                        options: ['"True"', "1", "True", "true"],
                        answer: 2,
                        explanation: "Boolean Python ditulis True atau False dengan huruf pertama kapital."
                    },
                    {
                        text: "Apa hasil dari 3 ** 2?",
                        options: ["6", "9", "8", "5"],
                        answer: 1,
                        explanation: "Operator ** melakukan pemangkatan, jadi 3 ** 2 berarti 3 pangkat 2."
                    },
                    {
                        text: "Kata kunci apa yang digunakan untuk membuat fungsi?",
                        options: ["function", "fun", "def", "make"],
                        answer: 2,
                        explanation: "Fungsi di Python dideklarasikan dengan kata kunci def."
                    },
                    {
                        text: "Struktur data mana yang dapat diubah dan ditulis menggunakan tanda kurung siku?",
                        options: ["Tuple", "List", "String", "Integer"],
                        answer: 1,
                        explanation: "List bersifat mutable (dapat diubah) dan biasanya ditulis seperti [1, 2, 3]."
                    },
                    {
                        text: "Apa hasil dari len('kuis')?",
                        options: ["3", "4", "5", '"kuis"'],
                        answer: 1,
                        explanation: "len() menghitung jumlah karakter. Kata 'kuis' terdiri dari 4 karakter."
                    },
                    {
                        text: "Bagaimana cara menulis komentar satu baris di Python?",
                        options: ["// komentar", "<!-- komentar -->", "# komentar", "/* komentar */"],
                        answer: 2,
                        explanation: "Komentar satu baris Python diawali dengan tanda pagar (#)."
                    },
                    {
                        text: "Perulangan mana yang cocok digunakan saat jumlah pengulangan diketahui?",
                        options: ["for", "if", "try", "with"],
                        answer: 0,
                        explanation: "for umum digunakan untuk mengulang setiap item dalam urutan atau range."
                    }
                ]
            },
            {
                id: "logika-pemrograman",
                title: "Logika Pemrograman",
                description: "Latih pola pikir, percabangan, dan operator logika.",
                icon: "🧠",
                theme: "mint",
                questions: [
                    {
                        text: "Jika x = 7, berapa nilai dari x > 5 and x < 10?",
                        options: ["False", "True", "7", "Error"],
                        answer: 1,
                        explanation: "Kedua kondisi terpenuhi: 7 lebih besar dari 5 dan lebih kecil dari 10."
                    },
                    {
                        text: "Apa fungsi utama percabangan if/else?",
                        options: ["Mengulang instruksi", "Memilih aksi berdasarkan kondisi", "Menyimpan data", "Menghentikan program"],
                        answer: 1,
                        explanation: "if/else memilih blok instruksi yang berjalan sesuai benar atau tidaknya kondisi."
                    },
                    {
                        text: "Berapa hasil penjumlahan 1 + 2 + 3 + 4?",
                        options: ["9", "10", "11", "24"],
                        answer: 1,
                        explanation: "Jumlahkan berurutan: 1 + 2 + 3 + 4 = 10."
                    },
                    {
                        text: "Operator logika mana yang bernilai benar jika minimal satu kondisi benar?",
                        options: ["and", "not", "or", "is"],
                        answer: 2,
                        explanation: "Operator or bernilai benar jika salah satu atau kedua kondisi bernilai benar."
                    },
                    {
                        text: "Pada flowchart, bentuk belah ketupat biasanya menandakan apa?",
                        options: ["Awal atau akhir", "Proses", "Keputusan atau kondisi", "Input/output"],
                        answer: 2,
                        explanation: "Simbol belah ketupat menandakan keputusan yang memiliki cabang seperti Ya/Tidak."
                    },
                    {
                        text: "Jika sebuah loop tidak pernah membuat kondisinya berhenti, apa yang mungkin terjadi?",
                        options: ["Loop berjalan tanpa henti", "Program langsung selesai", "Variabel otomatis dihapus", "Kondisi berubah sendiri"],
                        answer: 0,
                        explanation: "Tanpa kondisi berhenti yang tercapai, loop bisa menjadi infinite loop."
                    }
                ]
            }
        ];

        const STORAGE_KEY = "ruangkuis_attempts_v1";
        const app = document.getElementById("app");
        let currentQuiz = null;
        let currentAnswers = [];
        let currentQuestion = 0;
        let currentAttempt = null;
        let storageNotice = "";
        let attempts = loadAttempts();

        function loadAttempts() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return [];
                const parsed = JSON.parse(saved);
                if (!Array.isArray(parsed)) throw new Error("Format riwayat tidak valid.");
                return parsed.filter((item) =>
                    item && typeof item.id === "string" &&
                    Array.isArray(item.questions) && Array.isArray(item.answers)
                ).slice(0, 50);
            } catch (error) {
                storageNotice = "Riwayat skor tidak dapat dibaca dari penyimpanan browser. Kuis tetap bisa dimainkan, tetapi hasil sebelumnya mungkin tidak tersedia.";
                return [];
            }
        }

        function saveAttempts() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(attempts.slice(0, 50)));
                storageNotice = "";
                return true;
            } catch (error) {
                storageNotice = "Hasil kuis ini tidak dapat disimpan di browser. Periksa ruang penyimpanan atau pengaturan privasi browser Anda.";
                return false;
            }
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, (character) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            })[character]);
        }

        function formatDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "Tanggal tidak diketahui";
            return new Intl.DateTimeFormat("id-ID", {
                dateStyle: "medium",
                timeStyle: "short"
            }).format(date);
        }

        function scoreFor(questions, answers) {
            return questions.reduce((total, question, index) =>
                total + (answers[index] === question.answer ? 1 : 0), 0);
        }

        function noticeHTML() {
            return storageNotice ? `<p class="notice" role="status">${escapeHTML(storageNotice)}</p>` : "";
        }

        function renderHome() {
            currentQuiz = null;
            const cards = QUIZZES.map((quiz) => `
                <article class="quiz-card">
                    <div class="card-top">
                        <div class="quiz-icon ${quiz.theme}" aria-hidden="true">${quiz.icon}</div>
                        <div>
                            <h3>${escapeHTML(quiz.title)}</h3>
                            <p class="description">${escapeHTML(quiz.description)}</p>
                        </div>
                    </div>
                    <div class="card-bottom">
                        <span class="quiz-meta">${quiz.questions.length} soal · Pilihan ganda</span>
                        <button class="button" data-action="start" data-quiz="${quiz.id}">Mulai kuis <span aria-hidden="true">→</span></button>
                    </div>
                </article>
            `).join("");
            const history = attempts.map((attempt) => {
                const result = scoreFor(attempt.questions, attempt.answers);
                return `
                    <article class="history-row">
                        <div>
                            <p class="history-title">${escapeHTML(attempt.title)}</p>
                            <p class="history-date">${escapeHTML(formatDate(attempt.date))}</p>
                        </div>
                        <div class="history-score">
                            <span class="score-pill">${result}/${attempt.questions.length}</span>
                            <button class="button subtle" data-action="review-saved" data-attempt="${escapeHTML(attempt.id)}">Review</button>
                        </div>
                    </article>
                `;
            }).join("");

            app.innerHTML = `
                <section class="hero">
                    <p class="eyebrow">Ruang belajar kamu</p>
                    <h1>Belajar sedikit,<br>jago selangkah demi selangkah.</h1>
                    <p class="hero-copy">Pilih kuis, jawab dengan santai, lalu lihat hasil dan pembahasanmu. Skor tersimpan di perangkat ini, jadi kamu bisa mengulang kapan saja.</p>
                </section>
                <section aria-labelledby="quiz-heading">
                    <div class="section-heading">
                        <div>
                            <h2 id="quiz-heading">Pilih kuis</h2>
                            <p>Mulai dari topik yang ingin kamu kuasai.</p>
                        </div>
                    </div>
                    <div class="quiz-grid">${cards}</div>
                </section>
                <section class="history-section" aria-labelledby="history-heading">
                    <div class="section-heading">
                        <div>
                            <h2 id="history-heading">Riwayat skor</h2>
                            <p>${attempts.length ? "Lihat hasil dan review percobaan sebelumnya." : "Hasil kuismu akan tersimpan di sini."}</p>
                        </div>
                    </div>
                    <div class="history-list">${history || '<div class="empty-history">Belum ada hasil. Selesaikan kuis pertamamu untuk melihat skor di sini!</div>'}</div>
                </section>
                ${noticeHTML()}
            `;
        }

        function startQuiz(quizId) {
            currentQuiz = QUIZZES.find((quiz) => quiz.id === quizId);
            if (!currentQuiz) return;
            currentAnswers = Array(currentQuiz.questions.length).fill(null);
            currentQuestion = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const question = currentQuiz.questions[currentQuestion];
            const answered = currentAnswers.filter((answer) => answer !== null).length;
            const options = question.options.map((option, index) => `
                <button class="answer-option ${currentAnswers[currentQuestion] === index ? "selected" : ""}"
                    data-action="answer" data-option="${index}" aria-pressed="${currentAnswers[currentQuestion] === index}">
                    <span class="answer-letter">${String.fromCharCode(65 + index)}</span>
                    <span class="answer-label">${escapeHTML(option)}</span>
                </button>
            `).join("");
            const nav = currentQuiz.questions.map((_, index) => `
                <button class="nav-dot ${index === currentQuestion ? "current" : ""} ${currentAnswers[index] !== null ? "answered" : ""}"
                    data-action="go-question" data-question="${index}" aria-label="Ke soal ${index + 1}${currentAnswers[index] !== null ? ", sudah dijawab" : ""}"
                    aria-current="${index === currentQuestion ? "step" : "false"}">${index + 1}</button>
            `).join("");

            app.innerHTML = `
                <section class="quiz-shell">
                    <div class="quiz-header">
                        <div class="quiz-header-left">
                            <div class="quiz-icon ${currentQuiz.theme}" aria-hidden="true">${currentQuiz.icon}</div>
                            <div><h1>${escapeHTML(currentQuiz.title)}</h1><p>${currentQuiz.questions.length} soal · Pilih satu jawaban</p></div>
                        </div>
                        <button class="button secondary" data-action="home">Keluar</button>
                    </div>
                    <div class="progress-wrap" aria-label="Progres kuis">
                        <div class="progress-label"><span>Soal ${currentQuestion + 1} dari ${currentQuiz.questions.length}</span><span>${answered} dijawab</span></div>
                        <div class="progress-track"><div class="progress-fill" style="width:${((currentQuestion + 1) / currentQuiz.questions.length) * 100}%"></div></div>
                    </div>
                    <article class="question-card">
                        <p class="question-number">Pertanyaan ${String(currentQuestion + 1).padStart(2, "0")}</p>
                        <h2 class="question-text">${escapeHTML(question.text)}</h2>
                        <div class="answer-list">${options}</div>
                        <div class="question-footer">
                            <button class="button secondary" data-action="previous" ${currentQuestion === 0 ? "disabled" : ""}>← Sebelumnya</button>
                            ${currentQuestion === currentQuiz.questions.length - 1
                                ? '<button class="button" data-action="finish">Lihat hasil <span aria-hidden="true">✓</span></button>'
                                : '<button class="button" data-action="next">Berikutnya →</button>'}
                        </div>
                    </article>
                    <div class="question-nav" aria-label="Navigasi soal">${nav}</div>
                    <p class="answer-hint">Kamu bisa berpindah soal kapan saja. Jawabanmu tersimpan selama kuis berlangsung.</p>
                    ${noticeHTML()}
                </section>
            `;
        }

        function finishQuiz() {
            const total = currentQuiz.questions.length;
            const correct = scoreFor(currentQuiz.questions, currentAnswers);
            currentAttempt = {
                id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                quizId: currentQuiz.id,
                title: currentQuiz.title,
                date: new Date().toISOString(),
                questions: currentQuiz.questions.map((question) => ({
                    text: question.text,
                    options: [...question.options],
                    answer: question.answer,
                    explanation: question.explanation
                })),
                answers: [...currentAnswers],
                score: correct
            };
            attempts = [currentAttempt, ...attempts].slice(0, 50);
            saveAttempts();
            renderResult(currentAttempt);
        }

        function renderResult(attempt) {
            const total = attempt.questions.length;
            const correct = scoreFor(attempt.questions, attempt.answers);
            const unanswered = attempt.answers.filter((answer) => answer === null).length;
            const percent = Math.round((correct / total) * 100);
            let message = "Terus berlatih, kamu pasti makin jago!";
            let icon = "💪";
            if (percent === 100) { message = "Sempurna! Kamu menguasai materi ini."; icon = "🏆"; }
            else if (percent >= 75) { message = "Hebat! Pemahamanmu sudah kuat."; icon = "🎉"; }
            else if (percent >= 50) { message = "Bagus! Sedikit lagi kamu makin mantap."; icon = "✨"; }

            app.innerHTML = `
                <section class="result-card">
                    <div class="result-icon" aria-hidden="true">${icon}</div>
                    <p class="eyebrow" style="color:var(--purple)">Kuis selesai</p>
                    <h1>${escapeHTML(message)}</h1>
                    <p class="result-subtitle">${escapeHTML(attempt.title)} · ${escapeHTML(formatDate(attempt.date))}</p>
                    <div class="score-number">${percent}<span style="font-size:25px">%</span></div>
                    <p class="score-caption">${correct} dari ${total} jawaban benar</p>
                    <div class="stat-grid">
                        <div class="stat"><strong>${correct}</strong><span>Benar</span></div>
                        <div class="stat"><strong>${total - correct - unanswered}</strong><span>Salah</span></div>
                        <div class="stat"><strong>${unanswered}</strong><span>Dilewati</span></div>
                    </div>
                    <div class="result-actions">
                        <button class="button" data-action="review-current">Review jawaban</button>
                        <button class="button secondary" data-action="retry">Ulangi kuis</button>
                        <button class="button secondary" data-action="home">Kembali ke beranda</button>
                    </div>
                    ${noticeHTML()}
                </section>
            `;
        }

        function renderReview(attempt) {
            currentAttempt = attempt;
            const correct = scoreFor(attempt.questions, attempt.answers);
            const cards = attempt.questions.map((question, index) => {
                const selected = attempt.answers[index];
                const isCorrect = selected === question.answer;
                const picked = selected === null ? "Tidak dijawab" : question.options[selected];
                return `
                    <article class="review-card ${isCorrect ? "correct" : "incorrect"}">
                        <p class="review-question">${index + 1}. ${escapeHTML(question.text)}</p>
                        <p class="review-line">Jawabanmu: <strong class="${selected === null ? "" : isCorrect ? "good" : "bad"}">${escapeHTML(picked)}</strong>${selected === null ? "" : isCorrect ? " ✓" : " ✕"}</p>
                        ${!isCorrect ? `<p class="review-line">Jawaban benar: <strong class="good">${escapeHTML(question.options[question.answer])}</strong></p>` : ""}
                        <p class="review-explanation">${escapeHTML(question.explanation)}</p>
                    </article>
                `;
            }).join("");

            app.innerHTML = `
                <section class="review-shell">
                    <div class="review-heading">
                        <div>
                            <h1>Review jawaban</h1>
                            <p>${escapeHTML(attempt.title)} · Skor ${correct}/${attempt.questions.length} · ${escapeHTML(formatDate(attempt.date))}</p>
                        </div>
                        <button class="button secondary" data-action="back-result">Kembali</button>
                    </div>
                    ${cards}
                    <div class="review-footer">
                        <button class="button" data-action="retry-attempt">Coba kuis ini lagi</button>
                        <button class="button secondary" data-action="home">Beranda</button>
                    </div>
                </section>
            `;
        }

        app.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;
            const action = button.dataset.action;

            if (action === "start") startQuiz(button.dataset.quiz);
            if (action === "home") renderHome();
            if (action === "answer") {
                currentAnswers[currentQuestion] = Number(button.dataset.option);
                renderQuestion();
            }
            if (action === "next") {
                currentQuestion = Math.min(currentQuestion + 1, currentQuiz.questions.length - 1);
                renderQuestion();
            }
            if (action === "previous") {
                currentQuestion = Math.max(currentQuestion - 1, 0);
                renderQuestion();
            }
            if (action === "go-question") {
                currentQuestion = Number(button.dataset.question);
                renderQuestion();
            }
            if (action === "finish") finishQuiz();
            if (action === "review-current" && currentAttempt) renderReview(currentAttempt);
            if (action === "review-saved") {
                const attempt = attempts.find((item) => item.id === button.dataset.attempt);
                if (attempt) renderReview(attempt);
            }
            if (action === "retry" && currentAttempt) startQuiz(currentAttempt.quizId);
            if (action === "retry-attempt" && currentAttempt) startQuiz(currentAttempt.quizId);
            if (action === "back-result" && currentAttempt) renderResult(currentAttempt);
        });

        document.getElementById("home-link").addEventListener("click", (event) => {
            event.preventDefault();
            renderHome();
        });

        renderHome();
    </script>
</body>
</html>
